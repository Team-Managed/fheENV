name: Native credential stores

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  native-keyring:
    name: Native keyring (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fheenv
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fheenv/pnpm-lock.yaml

      - name: Start isolated Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
          dbus_address="$(dbus-daemon --session --fork --print-address=1)"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          keyring_output="$(printf 'fheenv-ci\n' | gnome-keyring-daemon --unlock --components=secrets)"
          while IFS= read -r line; do
            case "$line" in
              GNOME_KEYRING_CONTROL=*) echo "$line" >> "$GITHUB_ENV" ;;
            esac
          done <<< "$keyring_output"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Round-trip native credential
        run: pnpm run test:cli:keyring-integration
